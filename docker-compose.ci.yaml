services:
  fake-mychart:
    build: ./fake-mychart
    ports:
      - "4000:3000"
    environment:
      # Deliberately NOT FAKE_MYCHART_ACCEPT_ANY. Every suite that runs against
      # this service signs in as the seeded homer/donuts123, so the knob bought
      # nothing — and it broke the suites that assert a *bad* password is
      # rejected, which is what kept the scraper integration tests confined to a
      # separately-started server. Without it, one `bun run test:integration`
      # covers every integration suite in the repo against this one service.
      PORT: "3000"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/',{redirect:'manual'}).then(r => process.exit(r.status === 302 || r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 3s
      timeout: 10s
      retries: 20
