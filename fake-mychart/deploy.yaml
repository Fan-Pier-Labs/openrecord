platform: "fargate"
app_name: "fake-mychart"
# Built from the repo root (the deploy tool builds with the cwd as the
# Docker context, and `bun run deploy` chdirs there) so the image can carry
# shared/ alongside fake-mychart/.
dockerfile: "fake-mychart/Dockerfile"
aws:
  profile: "fanpierlabs"
  region: "us-east-2"
public:
  domain: "fake-mychart.fanpierlabs.com"

task:
  cpu: 512
  memory: 1024
  spot: true
  replicas: 1
  ephemeral_storage: 21
  port: 8080

env:
  FAKE_MYCHART_ACCEPT_ANY: "false"

allow_create: true
