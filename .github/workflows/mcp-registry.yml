name: Publish to the MCP Registry
# Lists each Claude Desktop extension release on registry.modelcontextprotocol.io.
# deploy.sh creates the GitHub Release mcpb-v<version> with the user's own gh
# login, which (unlike GITHUB_TOKEN) does trigger this workflow.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. mcpb-v2.3.0
        required: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'mcpb-v')
    runs-on: ubuntu-latest
    permissions:
      # OIDC is what grants the io.github.Fan-Pier-Labs/* namespace; the
      # interactive `login github` cannot publish to an organization namespace.
      id-token: write
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz
          echo "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      # The registry stores the hash but never checks it; clients refuse to
      # install a bundle whose bytes don't match, so it has to come from the
      # asset actually attached to the release.
      - name: Point server.json at this release
        working-directory: claude-desktop-extension
        run: |
          gh release download "$TAG" --pattern openrecord.mcpb --dir "$RUNNER_TEMP"
          jq --arg v "${TAG#mcpb-v}" \
             --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/openrecord.mcpb" \
             --arg sha "$(sha256sum "$RUNNER_TEMP/openrecord.mcpb" | cut -d' ' -f1)" \
             '.version = $v | .packages[0].identifier = $url | .packages[0].fileSha256 = $sha' \
             server.json > "$RUNNER_TEMP/server.json"
          mv "$RUNNER_TEMP/server.json" server.json
          cat server.json
      - name: Publish
        working-directory: claude-desktop-extension
        run: |
          ../mcp-publisher login github-oidc
          ../mcp-publisher publish
