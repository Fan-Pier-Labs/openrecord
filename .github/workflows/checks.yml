name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      # setup-bun downloads from the GitHub release CDN, which intermittently
      # answers 503 or hangs up. Retry once before failing the job.
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@v2
        if: steps.bun.outcome == 'failure'
        with:
          bun-version-file: .bun-version
      - run: bun install
      # Before the unit suite, not after it: `bun run test` scans the whole repo
      # for *.unit.test.ts, which reaches
      # claude-desktop-extension/src/__tests__, and the capability-parity test
      # imports the extension's real registerAllTools to check it registers a
      # tool per capability. Both need the extension's own dependencies (zod,
      # the MCP SDK), so they have to be installed first.
      - name: Install Claude Desktop extension deps
        run: cd claude-desktop-extension && bun install
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx eslint .
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      # Root tsconfig covers scrapers/, shared/, npm-package/cli/ and
      # read-local-passwords/ — the shared scraper core no other package's
      # typecheck reaches.
      - name: Typecheck scrapers, shared and CLI
        run: bun run typecheck
      - name: Install Expo app deps
        run: cd expo-app && bun install
      - name: Typecheck Expo app
        run: cd expo-app && bun run typecheck
      - name: Typecheck & build Claude Desktop extension
        run: cd claude-desktop-extension && bun run build
      - run: bun run test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level, not per-step: every integration suite in the repo now runs in
    # this one job, and the previous shape — the env var on the individual test
    # steps — is exactly what broke when they merged. One suite defaulted to the
    # hosted fake-mychart and went out to the public internet.
    env:
      FAKE_MYCHART_HOST: localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@v2
        if: steps.bun.outcome == 'failure'
        with:
          bun-version-file: .bun-version
      - run: bun install
      # Every package whose sources the integration suites or the coverage gate
      # touch. The extension's deps are needed twice over: its imaging suite
      # imports jpeg-js, and without them its modules fail to import and drop
      # out of the coverage report entirely, which reads ~1.5 points high.
      - name: Install package deps
        run: |
          cd claude-desktop-extension && bun install && cd ..
          cd npm-package && bun install && cd ..
          cd tests/integration/ci && bun install
      - name: Install Playwright browsers
        run: cd tests/integration/ci && bunx playwright install --with-deps chromium
      # npm-package's integration suite imports the BUILT `dist/index.js` on
      # purpose — it exists to test what consumers actually install — so the
      # build has to happen before anything runs.
      - name: Build npm-package CLI binary
        run: cd npm-package && bun run build
      # After the build on purpose: npm-package's integration test imports the
      # built dist/ bundle, so the typecheck needs it to exist.
      - name: Typecheck npm-package
        run: cd npm-package && bun run typecheck
      # One fake-mychart for every integration suite in the repo. This used to be
      # two servers in two jobs: this one, and a natively-built one started just
      # for the scraper suites, because the compose service ran with
      # FAKE_MYCHART_ACCEPT_ANY=true and those suites assert a bad password is
      # rejected. The knob was never needed — everything signs in as the seeded
      # homer — so it's gone and the jobs are one.
      - name: Start services
        run: docker compose -f docker-compose.ci.yaml up -d --build --wait
        timeout-minutes: 10
      - name: Run integration tests
        run: bun run test:integration
      # The gate lives here, not in the `build` job, because it measures the unit
      # suite AND the integration suites together, in one process. Splitting them
      # would count every scraper that is only exercised end-to-end as uncovered,
      # making the percentage an artifact of which suite happened to run. This is
      # the only job with the server, the built CLI and every package's deps, so
      # it is the only place the gate can measure everything.
      - name: Check code coverage (Bun coverageThreshold, 75% per file)
        run: bun run test:coverage
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yaml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yaml down -v
