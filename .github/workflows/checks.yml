name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      # setup-bun downloads from the GitHub release CDN, which intermittently
      # answers 503 or hangs up. Retry once before failing the job.
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@v2
        if: steps.bun.outcome == 'failure'
        with:
          bun-version-file: .bun-version
      - run: bun install
      # Before the unit suite, not after it: the root test glob reaches into
      # claude-desktop-extension/src/__tests__, and the capability-parity test
      # imports the extension's real registerAllTools to check it registers a
      # tool per capability. Both need the extension's own dependencies (zod,
      # the MCP SDK), so they have to be installed first.
      - name: Install Claude Desktop extension deps
        run: cd claude-desktop-extension && bun install
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx eslint .
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      - name: Typecheck & build Claude Desktop extension
        run: cd claude-desktop-extension && bun run build
      # test:unit, not test — `test` also runs test:integration, which needs a
      # fake-mychart server this job does not start. That tier is the job below.
      - run: bun run test:unit

  fake-mychart:
    name: Fake MyChart integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@v2
        if: steps.bun.outcome == 'failure'
        with:
          bun-version-file: .bun-version
      - run: bun install
      - name: Install fake-mychart deps
        run: cd fake-mychart && bun install
      - name: Build & start fake-mychart server
        run: |
          cd fake-mychart && bun run build && PORT=4000 bun run start &
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/ | grep -q '302'; then
              echo "Server ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Server failed to start within 30s"
              exit 1
            fi
            echo "Waiting for server... ($i)"
            sleep 1
          done
      # The integration suites live in every package's own __tests__/fake-mychart
      # folder, so one command covers scrapers, the Desktop extension and the
      # npm package. Their deps still have to be present, and the npm suite
      # imports the built artifact rather than source, hence the steps below.
      - name: Install Claude Desktop extension deps
        run: cd claude-desktop-extension && bun install
      - name: Install & build npm-package
        run: cd npm-package && bun install && bun run build
      - name: Run integration tests against fake-mychart
        run: bun run test:integration
        env:
          FAKE_MYCHART_HOST: localhost:4000
      # The gate lives here, not in the `build` job, because it measures the unit
      # suite AND the fake-mychart suite together. Splitting them would count
      # every scraper that is only exercised end-to-end as uncovered, making the
      # percentage an artifact of which suite happened to run. This job already
      # has the server up and the extension's deps installed, so merging the two
      # costs no extra setup.
      #
      # It leaves out npm-package's fake-mychart suite alone: that one imports
      # the built dist/ bundle rather than source, so measuring it would drop a
      # single bundled megafile into a per-file gate. Every other suite is in.
      - name: Check code coverage (Bun coverageThreshold, 75% per file)
        run: bun run test:coverage
        env:
          FAKE_MYCHART_HOST: localhost:4000

  integration:
    name: Integration tests (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@v2
        if: steps.bun.outcome == 'failure'
        with:
          bun-version-file: .bun-version
      - run: bun install
      - run: cd tests/integration/ci && bun install
      - name: Install Playwright browsers
        run: cd tests/integration/ci && bunx playwright install --with-deps chromium
      - name: Build npm-package CLI binary
        run: cd npm-package && bun install && bun run build
      - name: Start services
        run: docker compose -f docker-compose.ci.yaml up -d --build --wait
        timeout-minutes: 10
      - name: Run integration tests
        run: bun run test:ci-integration
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yaml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yaml down -v
