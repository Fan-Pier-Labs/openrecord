name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      # setup-bun downloads from the GitHub release CDN, which intermittently
      # answers 503 or hangs up. Retry once before failing the job.
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@v2
        if: steps.bun.outcome == 'failure'
        with:
          bun-version-file: .bun-version
      - run: bun install
      # Before the unit suite, not after it: `bun run test` scans the whole repo
      # for *.unit.test.ts, which reaches
      # claude-desktop-extension/src/__tests__, and the capability-parity test
      # imports the extension's real registerAllTools to check it registers a
      # tool per capability. Both need the extension's own dependencies (zod,
      # the MCP SDK), so they have to be installed first.
      - name: Install Claude Desktop extension deps
        run: cd claude-desktop-extension && bun install
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx eslint .
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      # Root tsconfig covers scrapers/, shared/, npm-package/cli/ and
      # read-local-passwords/ — the shared scraper core no other package's
      # typecheck reaches.
      - name: Typecheck scrapers, shared and CLI
        run: bun run typecheck
      - name: Install Expo app deps
        run: cd expo-app && bun install
      - name: Typecheck Expo app
        run: cd expo-app && bun run typecheck
      - name: Typecheck & build Claude Desktop extension
        run: cd claude-desktop-extension && bun run build
      - run: bun run test

  android-emulator:
    name: Android emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Baked into the APK at build time (app.config.ts reads it into
      # `extra.backendUrl`). Points the app's AI backend at a dead localhost
      # port so the build under test cannot reach the real AI Lambda — the
      # smoke flow never gets past the Google sign-in gate anyway, but this
      # makes "no real LLM calls from CI" a build-time guarantee rather than
      # a property of the flow.
      EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      # Hardware acceleration for the emulator. ubuntu-latest runners expose
      # /dev/kvm, but it is root-only until this rule opens it up.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@v2
        if: steps.bun.outcome == 'failure'
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Gradle shells out to node to bundle the JS (expo export:embed).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Root deps too, not just expo-app's: Metro watches the repo root so the
      # bundle reaches into scrapers/ and shared/, which resolve some packages
      # from the root node_modules.
      - run: bun install
      - name: Install Expo app deps
        run: cd expo-app && bun install
      - name: Prebuild Android project
        run: cd expo-app && bunx expo prebuild --platform android --no-install
      - uses: gradle/actions/setup-gradle@v4
      # Release variant on purpose: it embeds the JS bundle, so the emulator
      # needs no Metro dev server, and it strips the __DEV__-only onboarding
      # skip button the smoke flow relies on NOT being able to pass.
      - name: Build release APK
        run: cd expo-app/android && ./gradlew assembleRelease
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34
      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install expo-app/android/app/build/outputs/apk/release/app-release.apk
            cd expo-app && maestro test e2e/android-smoke.yaml
      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-artifacts
          path: |
            expo-app/e2e-*.png
            ~/.maestro/tests/
          if-no-files-found: ignore

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level, not per-step: every integration suite in the repo now runs in
    # this one job, and the previous shape — the env var on the individual test
    # steps — is exactly what broke when they merged. One suite defaulted to the
    # hosted fake-mychart and went out to the public internet.
    env:
      FAKE_MYCHART_HOST: localhost:4000
    steps:
      - uses: actions/checkout@v4
      # One fake-mychart for every integration suite in the repo. This used to be
      # two servers in two jobs: this one, and a natively-built one started just
      # for the scraper suites, because the compose service ran with
      # FAKE_MYCHART_ACCEPT_ANY=true and those suites assert a bad password is
      # rejected. The knob was never needed — everything signs in as the seeded
      # homer — so it's gone and the jobs are one.
      #
      # Started in the background here — it needs nothing but the checkout, and
      # the image build is about as long as every install/build step below put
      # together, so running it concurrently roughly halves the job's setup
      # time. "Wait for services" below is the synchronization point.
      - name: Start services in background
        run: |
          docker compose -f docker-compose.ci.yaml up -d --build --wait > /tmp/compose-up.log 2>&1 &
          echo $! > /tmp/compose-up.pid
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@v2
        if: steps.bun.outcome == 'failure'
        with:
          bun-version-file: .bun-version
      - run: bun install
      # Every package whose sources the integration suites or the coverage gate
      # touch. The extension's deps are needed twice over: its imaging suite
      # imports jpeg-js, and without them its modules fail to import and drop
      # out of the coverage report entirely, which reads ~1.5 points high.
      - name: Install package deps
        run: |
          cd claude-desktop-extension && bun install && cd ..
          cd npm-package && bun install && cd ..
          cd tests/integration/ci && bun install
      - name: Install Playwright browsers
        run: cd tests/integration/ci && bunx playwright install --with-deps chromium
      # npm-package's integration suite imports the BUILT `dist/index.js` on
      # purpose — it exists to test what consumers actually install — so the
      # build has to happen before anything runs.
      - name: Build npm-package CLI binary
        run: cd npm-package && bun run build
      # After the build on purpose: npm-package's integration test imports the
      # built dist/ bundle, so the typecheck needs it to exist.
      - name: Typecheck npm-package
        run: cd npm-package && bun run typecheck
      # The backgrounded compose exit code is lost with its shell, so wait for
      # the process to finish, show its log, then re-run the same command in the
      # foreground: a no-op returning in seconds when the background run
      # succeeded (image built, container healthy), a visible retry from cached
      # layers when it didn't.
      - name: Wait for services
        run: |
          while kill -0 "$(cat /tmp/compose-up.pid)" 2>/dev/null; do sleep 1; done
          cat /tmp/compose-up.log
          docker compose -f docker-compose.ci.yaml up -d --build --wait
        timeout-minutes: 10
      # The one test-running step: `test:coverage` is `bun run test` and
      # `bun run test:integration` in one process (the gate has to see both
      # suites at once — see bunfig.toml), so a separate `test:integration` run
      # beforehand would execute every integration suite a second time for no
      # extra signal. Test failures and threshold failures both surface here.
      #
      # The gate lives here, not in the `build` job, because it measures the unit
      # suite AND the integration suites together, in one process. Splitting them
      # would count every scraper that is only exercised end-to-end as uncovered,
      # making the percentage an artifact of which suite happened to run. This is
      # the only job with the server, the built CLI and every package's deps, so
      # it is the only place the gate can measure everything.
      - name: Run integration tests + coverage gate (Bun coverageThreshold, 75% per file)
        run: bun run test:coverage
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yaml logs
      # No teardown step: the runner is ephemeral, so `down -v` only added ~10s
      # of nothing to every run.
