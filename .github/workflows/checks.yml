name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      # setup-bun downloads from the GitHub release CDN, which intermittently
      # answers 503 or hangs up. Retry once before failing the job.
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@v2
        if: steps.bun.outcome == 'failure'
        with:
          bun-version-file: .bun-version
      - run: bun install
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx eslint .
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      # Before the unit suite: the root test glob includes
      # claude-desktop-extension/src/__tests__, whose tool-registration tests
      # import the extension's own dependencies (zod, MCP SDK).
      - name: Typecheck & build Claude Desktop extension
        run: cd claude-desktop-extension && bun install && bun run build
      - run: bun run test

  fake-mychart:
    name: Fake MyChart integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@v2
        if: steps.bun.outcome == 'failure'
        with:
          bun-version-file: .bun-version
      - run: bun install
      - name: Install fake-mychart deps
        run: cd fake-mychart && bun install
      - name: Build & start fake-mychart server
        run: |
          cd fake-mychart && bun run build && PORT=4000 bun run start &
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/ | grep -q '302'; then
              echo "Server ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Server failed to start within 30s"
              exit 1
            fi
            echo "Waiting for server... ($i)"
            sleep 1
          done
      - name: Run scrapers against fake-mychart
        run: bun run test:fake-mychart
      - name: Run Claude Desktop extension tests against fake-mychart
        run: cd claude-desktop-extension && bun install && bun test
        env:
          FAKE_MYCHART_HOST: localhost:4000
      - name: Install npm-package deps
        run: cd npm-package && bun install
      - name: Build npm-package
        run: cd npm-package && bun run build
      - name: Run npm-package tests against local fake-mychart
        run: cd npm-package && bun run test
        env:
          FAKE_MYCHART_HOST: localhost:4000

  integration:
    name: Integration tests (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version-file: .bun-version
      - uses: oven-sh/setup-bun@v2
        if: steps.bun.outcome == 'failure'
        with:
          bun-version-file: .bun-version
      - run: bun install
      - run: cd tests/integration/ci && bun install
      - name: Install Playwright browsers
        run: cd tests/integration/ci && bunx playwright install --with-deps chromium
      - name: Build npm-package CLI binary
        run: cd npm-package && bun install && bun run build
      - name: Start services
        run: docker compose -f docker-compose.ci.yaml up -d --build --wait
        timeout-minutes: 10
      - name: Run integration tests
        run: bun run test:ci-integration
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yaml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yaml down -v
