# Coverage gate for `bun run test:coverage`, enforced in CI.
#
# These only take effect when `--coverage` is passed, so the plain `bun run test`
# and `bun run test:integration` runs are unaffected.
#
# SCOPE: every `*.unit.test.ts` and `*.integration.test.ts` in the repo, measured
# together in one process. It has to be both: the unit suite alone counts every
# scraper that is only exercised end-to-end as untested (~10 points low), and the
# integration suite alone does the reverse. That is why this is its own script
# rather than a flag on either one.
#
# It therefore needs everything the integration suite needs — the compose
# fake-mychart on :4000, npm-package's dist/ built, every package's deps
# installed — so the CI step lives in the `integration` job, the only one with
# all of it. Locally:
#
#   docker compose -f docker-compose.ci.yaml up -d --build --wait
#   cd npm-package && bun install && bun run build

[test]
coverageSkipTestFiles = true

# ── The bar ──────────────────────────────────────────────────────────────────
#
# Bun enforces this PER FILE, not on the aggregate: every measured file must
# clear 75% on its own. That is stricter than an overall average — no file can
# hide behind the rest — but it also means a file nobody has tested has to be
# covered or listed below, rather than being absorbed by a healthy average.
#
# The keys MUST be plural. Bun's own docs show `line`/`function`; those spellings
# are parsed and then SILENTLY IGNORED, leaving the gate reading as configured
# while enforcing nothing. Only `lines`, `functions` and `statements` are
# honoured. (`bun test -c <file>` is likewise ignored, which is why this has to
# live in the repo-root bunfig.)
coverageThreshold = { lines = 0.75, functions = 0.75 }

# ── Not product code ─────────────────────────────────────────────────────────
#
#   mock_data/         — test fixtures
#   list-all-mycharts/ — dev diagnostics (the directory probe), never shipped
#   generate_clo.ts    — the CLO *encoder*, which only exists to synthesise test
#                        images. Nothing outside a .test.ts file imports it.
#   fake-mychart/      — the stand-in MyChart server. Its fidelity is proven by
#                        the suites that run against it, not by covering its own
#                        source.
#   __tests__/         — test helpers. `coverageSkipTestFiles` only drops
#                        *.test.ts, so shared fixtures (mockMyChartRequest.ts,
#                        memfs.ts, mountMode.ts) were landing in the denominator.
#   dist/              — build output, measured only because npm-package's
#                        integration test imports the bundle on purpose (it
#                        exists to catch bundling breakage — a dropped export, an
#                        unbundled dep — that a source-level test can't see). The
#                        sources are already measured under their own paths;
#                        counting the bundle too would gate on tsup's output.
#   dev-scripts/       — run-it-yourself demos. They live in their own folder
#                        precisely so product modules don't carry
#                        `if (import.meta.main)` blocks: those are unreachable
#                        from a test, and under a per-file gate a few lines of
#                        demo code drag an otherwise well-covered module under
#                        the bar. One folder ignored beats waiving real modules.
#
# ── Below the bar, waived for now ────────────────────────────────────────────
#
# Everything below is real product code that simply isn't tested yet. It is
# waived so the per-file gate can be turned on today — NOT because it deserves
# less coverage. A waived file is wholly unchecked: 500 untested lines can be
# added to one without the gate noticing. Deleting entries from this list is how
# the gate gets stronger. Percentages are lines/functions when waived.
#
#   imaging/** (voi-lut 4%/0%, jpeg-encoder 14%/0%, download-study 7%/0%),
#   eunity/imagingViewer.ts (59%/79%), eunity/imagingDirectDownload.ts (72%/87%)
#     — the imaging pipeline. Needs a live eUnity server or large binary
#       fixtures. The CLO decoder underneath it is covered normally.
#   clo-image-parser/clo_to_jpg.ts (31%/75%)
#     — the uncovered half is the multi-format export path (avif/tiff/webp).
#   claude-desktop-extension/src/tools.ts (47%/56%)
#     — the per-tool handler bodies, each needing its scraper mocked.
#       Registration shape and the shared error path are covered.
#   claude-desktop-extension/src/session-manager.ts (31%/67%)
#     — the login and keepalive paths. Lifecycle and resolution are covered.
#   npm-package/src/client.ts (45%/1%), npm-package/cli/capabilityActions.ts (69%/71%)
#     — the library surface and CLI dispatch.
#   openrecord-demo-lambda/src/spend.mjs (41%/86%)
#     — createDynamoSpendStore needs the AWS SDK, absent locally by design. The
#       pure pricing and ledger logic is covered.
coveragePathIgnorePatterns = [
  "**/mock_data/**",
  "scrapers/list-all-mycharts/**",
  "**/clo-image-parser/generate_clo.ts",
  "fake-mychart/**",
  "**/__tests__/**",
  "**/dist/**",
  "dev-scripts/**",

  "claude-desktop-extension/src/imaging/**",
  "claude-desktop-extension/src/tools.ts",
  "claude-desktop-extension/src/session-manager.ts",
  "scrapers/myChart/eunity/imagingViewer.ts",
  "scrapers/myChart/eunity/imagingDirectDownload.ts",
  "**/clo-image-parser/clo_to_jpg.ts",
  "npm-package/src/client.ts",
  "npm-package/cli/capabilityActions.ts",
  "openrecord-demo-lambda/src/spend.mjs",
]
